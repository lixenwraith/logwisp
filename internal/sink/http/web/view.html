<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogWisp stream</title>
<meta name="logwisp-status" content="status">
<link rel="stylesheet" href="style.css">
<script type="module" src="view.js"></script>
</head>
<body class="viewer">
<header>
  <h1>LogWisp</h1>
  <span id="state" role="status">connecting…</span>
  <button id="logout" type="button">Sign out</button>
</header>
<form id="login" class="card" method="post" hidden>
  <p class="note">This browser keeps no cookie for this site, so the session lives in this page and ends when it closes.</p>
  <label>Username <input name="username" autocomplete="username" required></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit">Sign in</button>
  <progress id="progress" max="1" hidden></progress>
  <p id="status" role="status"></p>
</form>
<main id="log"></main>
</body>
</html>
