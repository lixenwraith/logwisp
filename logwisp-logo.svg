<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- LogWisp: five wisps swirl out of a grey core. #wisp is drawn once and
       turned 72 degrees per leg; legs meet only under the core, so no two
       colours share an edge. Every fill keeps 3:1 contrast on #ffffff and
       on #0d1117. -->
  <defs>
    <path id="wisp" d="M50,50 C50,36.8 61.6,26.3 74.8,27.8 C87.9,29.3 92.4,39.1 96.7,49.3
                       A1.8,1.8 0 0 1 93.3,50.7
                       C90.2,43.2 82.4,38.1 74.1,38.4 C65.3,38.8 56.1,43.7 50,50 Z"/>
  </defs>
  <g id="wisps">
    <use xlink:href="#wisp" fill="#E0409A"/>
    <use xlink:href="#wisp" fill="#D4640A" transform="rotate(72 50 50)"/>
    <use xlink:href="#wisp" fill="#169B58" transform="rotate(144 50 50)"/>
    <use xlink:href="#wisp" fill="#0891B2" transform="rotate(216 50 50)"/>
    <use xlink:href="#wisp" fill="#8E5CF0" transform="rotate(288 50 50)"/>
  </g>
  <circle id="core" cx="50" cy="50" r="4.5" fill="#7F8389"/>
</svg>
