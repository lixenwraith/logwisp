<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- LogWisp: five colored wisps interlock directly at the center.
       No central core; each wing meets the others at (50,50). -->

  <defs>
    <path id="wisp" d="
      M 50,50
      C 50,38.5 59.2,28.8 70.8,27.8
      C 82.9,26.7 91.2,35.4 96.7,49.3
      A 1.8,1.8 0 0 1 93.3,50.7
      C 89.1,42.8 82.0,38.2 74.1,38.4
      C 64.8,38.7 56.5,43.7 50,50
      Z
    "/>
  </defs>

  <g id="wisps">
    <use href="#wisp" fill="#E0409A"/>
    <use href="#wisp" fill="#D4640A" transform="rotate(72 50 50)"/>
    <use href="#wisp" fill="#169B58" transform="rotate(144 50 50)"/>
    <use href="#wisp" fill="#0891B2" transform="rotate(216 50 50)"/>
    <use href="#wisp" fill="#8E5CF0" transform="rotate(288 50 50)"/>
  </g>
</svg>
