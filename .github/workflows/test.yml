name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go test -timeout 60s -race ./...
      - run: go vet ./...
      - run: go build ./cmd/lw
      - run: GOOS=freebsd GOARCH=amd64 go build -o /tmp/lw-freebsd ./cmd/lw
      - run: node --test
        working-directory: internal/sink/http/web
  # The end-to-end scripts on a host with an IPv6 loopback; without playwright
  # the browser checks report SKIP, and the docker run needs root, so it skips
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build
      - run: make e2e
      # ipv6-test.sh skips without ::1, which would leave the job green untested
      - name: Require an IPv6 loopback
        run: grep -q '^0\{31\}1 ' /proc/net/if_inet6
